<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Flag Bomb Arena — Cinematic</title>
<style>
:root{--cyan:#55dcff;--gold:#ffd166;--red:#ff315d;--white:#f4fbff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01050d;color:var(--white);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.stage{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.7778vw);margin:auto;overflow:hidden;background:radial-gradient(circle at 50% 42%,#0b3153 0,#041425 35%,#01050c 72%)}canvas{position:absolute;inset:0;width:100%;height:100%}.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#fff0 0 3px,#fff006 4px);opacity:.035}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 43%,#0009 100%)}.hud{position:absolute;z-index:5;left:4%;right:4%;top:2.2%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:1000;letter-spacing:.12em;font-size:clamp(11px,2.5vh,20px);text-shadow:0 0 18px #55dcffcc}.live{padding:6px 10px;border:1px solid #ff315d99;border-radius:99px;background:#ff315d18;font-size:10px;font-weight:900}.live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff315d;box-shadow:0 0 14px #ff315d;margin-right:6px;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}.panel{position:absolute;z-index:5;left:4%;right:4%;border:1px solid #4dbdff44;border-radius:15px;background:#061222cc;backdrop-filter:blur(10px);box-shadow:0 12px 40px #0009}.status{top:7%;padding:9px 12px;display:flex;justify-content:space-between;align-items:center}.tiny{font-size:9px;color:#7895ae;letter-spacing:.12em}.state{font-weight:950;font-size:clamp(13px,2.4vh,20px)}.alive{color:var(--gold);font-weight:950}.feed{top:13%;padding:8px 10px}.feed b{font-size:10px;color:var(--red);letter-spacing:.1em}.feed span{display:block;margin-top:2px;font-size:clamp(11px,1.8vh,15px);font-weight:850}.bottom{position:absolute;z-index:8;bottom:2%;left:4%;right:4%;display:grid;gap:6px}.controls{display:flex;gap:6px;justify-content:center}.btn{border:1px solid #24537a;background:#061525dd;color:#eaf8ff;border-radius:11px;padding:8px 10px;font-weight:850;font-size:10px;cursor:pointer}.btn.primary{border-color:#55dcff88;background:#0c3855}.legend{text-align:center;font-size:9px;color:#7d96ad}.legend strong{color:#55dcff}.overlay{position:absolute;z-index:20;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#01050de8}.overlay.hide{display:none}.card{width:90%;padding:24px 18px;border:1px solid #55dcff55;border-radius:24px;background:linear-gradient(145deg,#091b30ee,#040b16ee);box-shadow:0 25px 100px #000}.card h1{margin:0 0 8px;font-size:clamp(25px,5vh,44px);text-shadow:0 0 30px #55dcff88}.card p{margin:0 0 18px;color:#9bb5cc;line-height:1.45;font-size:13px}
</style></head><body><div class="stage"><canvas id="g"></canvas><div class="scan"></div><div class="vignette"></div><div class="hud"><div class="brand">FLAG BOMB ARENA</div><div class="live"><i></i> LIVE</div></div><div class="panel status"><div><div class="tiny">ROUND <b id="round">1</b></div><div class="state" id="state">READY</div></div><div class="alive"><span id="alive">0</span> ALIVE</div></div><div class="panel feed"><b id="etype">ARENA STATUS</b><span id="event">All countries entering the arena…</span></div><div class="bottom"><div class="controls"><button class="btn primary" id="pause">PAUSE</button><button class="btn" id="reset">RESTART</button><button class="btn" id="sound">🔊 SOUND</button><button class="btn" id="voice">🔈 VOICE</button></div><div class="legend">Random target • <strong>Last flag standing wins</strong> • 9:16 LIVE</div></div><div class="overlay" id="overlay"><div class="card"><h1>⚡ FLAG BOMB ARENA</h1><p>Every country enters the orbital arena. A random flag is hunted, locked, bombed and eliminated. Watch the final survivor claim the round.</p><button class="btn primary" id="start">▶ START BATTLE</button></div></div></div>
<script>
const CODES=`ad ae af ag al am ao ar at au az ba bb bd be bf bg bh bi bj bn bo br bs bt bw by bz ca cd cf cg ch ci cl cm cn co cr cu cv cy cz de dj dk dm do dz ec ee eg er es et fi fj fm fr ga gb gd ge gh gm gn gq gr gt gw gy hn hr ht hu id ie il in iq ir is it jm jo jp ke kg kh ki km kn kp kr kw kz la lb lc li lk lr ls lt lu lv ly ma mc md me mg mh mk ml mm mn mr mt mu mv mw mx my mz na ne ng ni nl no np nr nz om pa pe pg ph pk pl ps pt pw py qa ro rs ru rw sa sb sc sd se sg si sk sl sm sn so sr ss st sv sy sz td tg th tj tl tm tn to tr tt tv tw tz ua ug us uy uz va vc ve vn vu ws xk ye za zm zw`.split(' ');
const names=new Intl.DisplayNames(['en'],{type:'region'}),FLAGS=CODES.map(code=>({code,name:names.of(code.toUpperCase())||code.toUpperCase()}));
const c=document.getElementById('g'),x=c.getContext('2d'),TAU=Math.PI*2,$=id=>document.getElementById(id);const S={round:1,playing:false,paused:false,muted:false,voice:false,flags:[],bomb:null,next:0,last:0,R:0,rot:0,flash:0,shake:0,particles:[],sparks:[],stars:[],trail:[]};
for(let i=0;i<180;i++)S.stars.push({a:Math.random()*TAU,r:.08+Math.random()*.95,z:.3+Math.random()*2,s:.5+Math.random()*2});
function resize(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);S.R=Math.min(r.width*.405,r.height*.285)}addEventListener('resize',resize);resize();
function emoji(code){return code.toUpperCase().replace(/./g,ch=>String.fromCodePoint(127397+ch.charCodeAt(0)))}function shuffle(a){a=a.slice();for(let i=a.length-1;i;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}function center(){return{x:c.clientWidth/2,y:c.clientHeight*.49}}function pos(f){let q=center(),r=S.R*f.r;return{x:q.x+Math.cos(f.a+S.rot)*r,y:q.y+Math.sin(f.a+S.rot)*r}}
function reset(){S.flags=shuffle(FLAGS).map((f,i)=>({...f,dead:false,a:TAU*i/FLAGS.length,r:.48+Math.random()*.43,v:(.07+Math.random()*.09)*(Math.random()<.5?-1:1),phase:Math.random()*TAU,pulse:0}));S.bomb=null;S.next=performance.now()+4200;S.particles=[];S.sparks=[];S.trail=[];S.flash=0;S.shake=0;$('round').textContent=S.round;$('alive').textContent=S.flags.length;$('state').textContent='ARMING ARENA';$('etype').textContent='ARENA STATUS';$('event').textContent='All countries deployed — first target soon…'}
function say(t){if(!S.voice||S.muted||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.93;u.pitch=.9;speechSynthesis.speak(u)}function tone(k){if(S.muted)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!window.ac)window.ac=new A;let a=window.ac,o=a.createOscillator(),g=a.createGain();o.type=k==='boom'?'sawtooth':k==='win'?'triangle':'sine';o.frequency.setValueAtTime(k==='boom'?95:k==='win'?520:260,a.currentTime);o.frequency.exponentialRampToValueAtTime(k==='boom'?42:k==='win'?1040:700,a.currentTime+(k==='boom'?.38:.18));g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(k==='boom'?.3:.1,a.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+(k==='boom'?.45:.22));o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+(k==='boom'?.48:.24))}catch{}}
function spark(px,py,n=10,life=.5){for(let i=0;i<n;i++){let a=Math.random()*TAU,sp=80+Math.random()*380;S.sparks.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:life*(.5+Math.random()),max:life,r:1+Math.random()*3})}}
function choose(){let live=S.flags.filter(f=>!f.dead);if(live.length<=1){finish();return}let f=live[Math.random()*live.length|0];S.bomb={code:f.code,t:performance.now()};f.pulse=1;let p=pos(f);spark(p.x,p.y,14,.35);tone('lock');say('Target locked: '+f.name);$('state').textContent='TARGET LOCKED';$('etype').textContent='⚠ TARGET ACQUIRED';$('event').textContent=emoji(f.code)+' '+f.name+' has been selected!';S.next=performance.now()+2500}
function eliminate(f){let p=pos(f);f.dead=true;S.bomb=null;S.shake=22;S.flash=1;S.next=performance.now()+1050;for(let i=0;i<105;i++){let a=Math.random()*TAU,sp=80+Math.random()*520;S.particles.push({x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.5+Math.random()*.9,max:1,r:2+Math.random()*7,kind:Math.random()})}spark(p.x,p.y,40,1);tone('boom');say(f.name+' has been eliminated.');$('state').textContent='ELIMINATED';$('etype').textContent='💥 DIRECT HIT';$('event').textContent=emoji(f.code)+' '+f.name+' is out of the arena'}
function finish(){let f=S.flags.find(z=>!z.dead);if(!f)return;S.playing=false;$('state').textContent='ROUND COMPLETE';$('etype').textContent='🏆 WINNER';$('event').textContent=emoji(f.code)+' '+f.name+' survived the chaos!';say('Round '+S.round+' winner: '+f.name);tone('win');S.flash=.6;for(let i=0;i<160;i++){let a=Math.random()*TAU,sp=80+Math.random()*500;S.particles.push({x:center().x,y:center().y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1+Math.random()*1.5,max:2,r:2+Math.random()*5,kind:.2})}setTimeout(()=>{S.round++;reset();S.playing=true},5000)}
function arena(t){let q=center(),R=S.R;x.save();x.translate(q.x+(Math.random()-.5)*S.shake,q.y+(Math.random()-.5)*S.shake);let g=x.createRadialGradient(0,0,R*.05,0,0,R*1.2);g.addColorStop(0,'#10466d');g.addColorStop(.45,'#06223b');g.addColorStop(1,'#010711');x.fillStyle=g;x.beginPath();x.arc(0,0,R,0,TAU);x.fill();for(let i=1;i<=6;i++){x.beginPath();x.arc(0,0,R*i/6,0,TAU);x.strokeStyle=i===6?'#55dcffcc':'#55dcff22';x.lineWidth=i===6?3:1;x.stroke()}x.save();x.rotate(t*.00018);x.setLineDash([18,12]);x.strokeStyle='#55dcff99';x.lineWidth=2;x.shadowColor='#55dcff';x.shadowBlur=15;x.beginPath();x.arc(0,0,R*.84,0,TAU);x.stroke();x.restore();x.setLineDash([]);x.strokeStyle='#55dcff';x.lineWidth=5;x.shadowColor='#55dcff';x.shadowBlur=28;x.beginPath();x.arc(0,0,R,.25,TAU-.25);x.stroke();let beam=(t*.0015)%TAU;x.rotate(beam);let lg=x.createLinearGradient(0,0,R,0);lg.addColorStop(0,'#55dcff00');lg.addColorStop(.7,'#55dcff18');lg.addColorStop(1,'#55dcff66');x.fillStyle=lg;x.beginPath();x.moveTo(0,0);x.lineTo(R,-R*.08);x.lineTo(R,R*.08);x.closePath();x.fill();x.restore()}
function stars(t){let q=center();for(let s of S.stars){let a=s.a+t*.00001*s.s,r=S.R*(s.r+.025*Math.sin(t*.001+s.a));x.globalAlpha=.12+.3*(.5+.5*Math.sin(t*.003+s.a*8));x.fillStyle='#b9efff';x.beginPath();x.arc(q.x+Math.cos(a)*r,q.y+Math.sin(a)*r,s.z,0,TAU);x.fill()}x.globalAlpha=1}
function flags(dt,t){for(let f of S.flags){if(f.dead)continue;f.a+=f.v*dt*.3;f.phase+=dt*2.4;f.pulse*=.92;let p=pos(f),sc=1+f.pulse*.22+.035*Math.sin(f.phase),danger=S.bomb&&S.bomb.code===f.code;x.save();x.translate(p.x,p.y);x.scale(sc,sc);x.shadowColor=danger?'#ff315d':'#55dcff';x.shadowBlur=danger?30:13;x.fillStyle='#06111e';x.beginPath();x.arc(0,0,25,0,TAU);x.fill();x.shadowBlur=0;x.font='26px "Apple Color Emoji","Segoe UI Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(emoji(f.code),0,0);x.strokeStyle=danger?'#ff315d':'#ffffff55';x.lineWidth=danger?3:1;x.beginPath();x.arc(0,0,25,0,TAU);x.stroke();x.font='800 9px system-ui';x.fillStyle=danger?'#ffb4c2':'#fff';x.fillText(f.name,0,40);if(danger){x.strokeStyle='#ff315d';x.globalAlpha=.65+.35*Math.sin(t*.015);x.beginPath();x.arc(0,0,35+8*Math.sin(t*.012),0,TAU);x.stroke();x.globalAlpha=1}x.restore()}}
function bomb(t){if(!S.bomb)return;let f=S.flags.find(z=>z.code===S.bomb.code);if(!f||f.dead)return;let p=pos(f),age=(t-S.bomb.t)/1000;S.trail.push({x:p.x,y:p.y-43,life:1});if(S.trail.length>38)S.trail.shift();x.save();for(let z of S.trail){x.globalAlpha=z.life*.35;x.fillStyle='#ff8c00';x.shadowColor='#ff8c00';x.shadowBlur=8;x.beginPath();x.arc(z.x,z.y,2+5*z.life,0,TAU);x.fill();z.life*=.88}x.globalAlpha=1;x.translate(p.x,p.y-43-Math.sin(age*10)*7);let pulse=1+Math.sin(age*18)*.12;x.scale(pulse,pulse);x.shadowColor='#ff315d';x.shadowBlur=30;x.fillStyle='#11151c';x.beginPath();x.arc(0,0,18,0,TAU);x.fill();x.shadowBlur=0;x.strokeStyle='#778899';x.lineWidth=2;x.stroke();x.fillStyle='#ff9d00';x.shadowColor='#ff9d00';x.shadowBlur=22;x.beginPath();x.arc(0,-21,5,0,TAU);x.fill();x.restore();x.save();x.translate(p.x,p.y);x.strokeStyle='#ff315d';x.lineWidth=2;x.setLineDash([5,5]);x.globalAlpha=.75;x.beginPath();x.arc(0,0,42+10*Math.sin(age*9),0,TAU);x.stroke();x.setLineDash([]);x.font='900 11px system-ui';x.fillStyle='#ff8da5';x.textAlign='center';x.fillText(Math.max(0,2-age).toFixed(1)+'s',0,-58);x.restore();if(age>2)eliminate(f)}
function particles(dt){for(let i=S.particles.length-1;i>=0;i--){let p=S.particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;p.vx*=.985;p.vy*=.985;if(p.life<=0){S.particles.splice(i,1);continue}x.globalAlpha=Math.min(1,p.life/p.max);x.fillStyle=p.kind>.25?'#ffb000':'#ff315d';x.shadowColor=x.fillStyle;x.shadowBlur=10;x.beginPath();x.arc(p.x,p.y,p.r,0,TAU);x.fill()}for(let i=S.sparks.length-1;i>=0;i--){let p=S.sparks[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;if(p.life<=0){S.sparks.splice(i,1);continue}x.globalAlpha=p.life/p.max;x.fillStyle='#fff';x.beginPath();x.arc(p.x,p.y,p.r,0,TAU);x.fill()}x.globalAlpha=1;x.shadowBlur=0}
function loop(t){let dt=Math.min(.04,(t-S.last)/1000||0);S.last=t;if(!S.paused){S.rot+=dt*.06;S.shake*=.84;arena(t);stars(t);if(S.playing&&!S.bomb&&t>=S.next)choose();flags(dt,t);bomb(t);particles(dt)}else{arena(t);stars(t);flags(0,t);particles(0)}if(S.flash>0){x.fillStyle='rgba(255,255,255,'+(S.flash*.28)+')';x.fillRect(0,0,c.clientWidth,c.clientHeight);S.flash*=.86}$('alive').textContent=S.flags.filter(f=>!f.dead).length;requestAnimationFrame(loop)}
$('start').onclick=()=>{try{const A=window.AudioContext||window.webkitAudioContext;if(!window.ac)window.ac=new A;window.ac.resume()}catch{}S.round=1;reset();S.playing=true;$('overlay').classList.add('hide');say('Flag Bomb Arena has begun')};$('pause').onclick=()=>{S.paused=!S.paused;$('pause').textContent=S.paused?'RESUME':'PAUSE'};$('reset').onclick=()=>{S.round=1;S.playing=true;reset()};$('sound').onclick=()=>{S.muted=!S.muted;$('sound').textContent=S.muted?'🔇 SOUND':'🔊 SOUND'};$('voice').onclick=()=>{S.voice=!S.voice;$('voice').textContent=S.voice?'🔊 VOICE ON':'🔈 VOICE';if(S.voice)say('Voice announcements enabled')};reset();requestAnimationFrame(loop);
</script></body></html>
