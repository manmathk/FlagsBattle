<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Which Country Will WIN?</title><style>*{box-sizing:border-box}body{margin:0;background:#17131a;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;min-height:100vh;background:linear-gradient(#17131a 0 120px,#110a38 120px 350px,#050616 350px);padding-bottom:30px}.hero{padding:48px 18px 20px;border-top:2px solid #7b6224}.title{font-size:clamp(28px,6vw,48px);font-weight:900;letter-spacing:-1px}.title span,.target{color:#ffd21c}.target{float:right;text-align:center;font-weight:900;font-size:18px;line-height:1}.target b{display:block;font-size:28px}.bar{margin:28px 0 18px;height:15px;border-radius:10px;background:#25234b;border:1px solid #413b70;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6b3cff,#ff2bbd);transition:width .35s}.status{font-size:12px;color:#aaa;margin-bottom:12px}.grid{border-top:2px solid #f02ab7;border-bottom:2px solid #f02ab7;padding:12px 6px;display:grid;grid-template-columns:repeat(10,1fr);gap:5px;background:#06071b}.cell{text-align:center;min-width:0}.rank{font-size:9px;color:#ffd21c;height:11px;font-weight:900}.flag{font-size:clamp(22px,5vw,38px);height:42px;display:flex;align-items:center;justify-content:center;background:#0d1028;border:1px solid #25294b;border-radius:2px}.score{font-weight:900;font-size:14px;margin-top:3px}.top1 .flag{border:2px solid #ffd21c}.top2 .flag{border:2px solid #ccc}.top3 .flag{border:2px solid #c77b30}.flash{animation:flash .45s}@keyframes flash{50%{transform:scale(1.12);filter:brightness(1.8)}}.legend{padding:12px 10px;color:#9f9fb4;font-size:12px;text-align:center}@media(max-width:520px){.grid{grid-template-columns:repeat(8,1fr);gap:4px}.flag{font-size:26px;height:34px}.score{font-size:12px}.title{font-size:28px}}</style></head><body><main class="wrap"><section class="hero"><div class="target">TARGET<b id="target">1000</b></div><div class="title">Which Country Will <span>WIN?</span></div><div class="bar"><i id="progress"></i></div><div class="status" id="status">Connecting…</div></section><section class="grid" id="grid"></section><div class="legend">Normal chat = +1 • Super Chat = +10 • Super Sticker = +10. Include a country name or flag in the message.</div></main><script>const grid=document.querySelector('#grid'),statusEl=document.querySelector('#status'),progress=document.querySelector('#progress'),targetEl=document.querySelector('#target');let prev=new Map();function render(d){targetEl.textContent=d.target;statusEl.textContent=d.status;const a=d.scores;const lead=Math.max(1,...a.map(x=>x.score));progress.style.width=Math.min(100,lead/d.target*100)+'%';grid.innerHTML='';a.forEach((x,i)=>{const el=document.createElement('div');el.className='cell '+(i<3?'top'+(i+1):'');if(x.score>(prev.get(x.name)||0))el.classList.add('flash');el.innerHTML='<div class="rank">'+(i<3?'RANK '+(i+1):'')+'</div><div class="flag" title="'+x.name+'">'+x.flag+'</div><div class="score">'+x.score+'</div>';grid.appendChild(el)});prev=new Map(a.map(x=>[x.name,x.score]))}function connect(){const w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);w.onmessage=e=>render(JSON.parse(e.data));w.onclose=()=>{statusEl.textContent='Disconnected — reconnecting…';setTimeout(connect,2000)}}connect();</script></body></html>
