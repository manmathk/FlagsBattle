<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Which Country Will WIN?</title><style>*{box-sizing:border-box}body{margin:0;background:#17131a;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;min-height:100vh;background:linear-gradient(#17131a 0 120px,#110a38 120px 350px,#050616 350px);padding-bottom:30px}.hero{padding:48px 18px 20px;border-top:2px solid #7b6224;position:relative}.title{font-size:clamp(28px,6vw,48px);font-weight:900;letter-spacing:-1px}.title span,.target{color:#ffd21c}.target{float:right;text-align:center;font-weight:900;font-size:18px;line-height:1}.target b{display:block;font-size:28px}.bar{margin:28px 0 18px;height:15px;border-radius:10px;background:#25234b;border:1px solid #413b70;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6b3cff,#ff2bbd);transition:width .35s}.status{font-size:12px;color:#aaa;margin-bottom:12px}.audio{position:absolute;right:18px;top:12px;border:1px solid #5a4d86;background:#17142d;color:#fff;border-radius:20px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}.audio.on{border-color:#ffd21c;color:#ffd21c}.grid{border-top:2px solid #f02ab7;border-bottom:2px solid #f02ab7;padding:12px 6px;display:grid;grid-template-columns:repeat(10,1fr);gap:5px;background:#06071b}.cell{text-align:center;min-width:0}.rank{font-size:9px;color:#ffd21c;height:11px;font-weight:900}.flag{font-size:clamp(22px,5vw,38px);height:42px;display:flex;align-items:center;justify-content:center;background:#0d1028;border:1px solid #25294b;border-radius:2px}.score{font-weight:900;font-size:14px;margin-top:3px}.top1 .flag{border:2px solid #ffd21c}.top2 .flag{border:2px solid #ccc}.top3 .flag{border:2px solid #c77b30}.flash{animation:flash .45s}@keyframes flash{50%{transform:scale(1.12);filter:brightness(1.8)}}.legend{padding:12px 10px;color:#9f9fb4;font-size:12px;text-align:center}@media(max-width:520px){.grid{grid-template-columns:repeat(8,1fr);gap:4px}.flag{font-size:26px;height:34px}.score{font-size:12px}.title{font-size:28px}}</style></head><body><main class="wrap"><section class="hero"><button class="audio" id="audioBtn" aria-label="Enable game audio">🔇 SOUND OFF</button><div class="target">TARGET<b id="target">1000</b></div><div class="title">Which Country Will <span>WIN?</span></div><div class="bar"><i id="progress"></i></div><div class="status" id="status">Connecting…</div></section><section class="grid" id="grid"></section><div class="legend">Normal chat = +1 • Super Chat = +10 • Super Sticker = +10. Include a country name or flag in the message.</div></main><script>const grid=document.querySelector('#grid'),statusEl=document.querySelector('#status'),progress=document.querySelector('#progress'),targetEl=document.querySelector('#target'),audioBtn=document.querySelector('#audioBtn');let prev=new Map(),ac=null,master=null,musicTimer=null,musicStep=0,audioOn=false,lastSound=0;function audioInit(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.13;master.connect(ac.destination)}if(ac.state==='suspended')ac.resume();audioOn=true;audioBtn.textContent='🔊 SOUND ON';audioBtn.classList.add('on');startMusic()}function tone(freq,dur=.09,type='sine',gain=.06,when=0){if(!audioOn||!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+when;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02)}function noise(dur=.07,gain=.025){if(!audioOn||!ac)return;const n=ac.createBufferSource(),b=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),data=b.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;n.buffer=b;const g=ac.createGain(),t=ac.currentTime;g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);n.connect(g);g.connect(master);n.start()}function voteSound(){tone(520,.07,'square',.035);tone(780,.1,'sine',.035,.055)}function boostSound(){tone(440,.08,'sawtooth',.045);tone(660,.1,'sawtooth',.05,.07);tone(990,.16,'sine',.055,.14);noise(.12,.015)}function startMusic(){if(musicTimer||!audioOn)return;const notes=[110,131,147,165,196,165,147,131,123,147,165,196,220,196,165,147];musicTimer=setInterval(()=>{if(!audioOn)return;tone(notes[musicStep%notes.length],.22,'triangle',.012);if(musicStep%4===0)tone(notes[musicStep%notes.length]/2,.35,'sine',.018);musicStep++},280)}audioBtn.onclick=()=>{if(audioOn){audioOn=false;audioBtn.textContent='🔇 SOUND OFF';audioBtn.classList.remove('on');if(master)master.gain.setTargetAtTime(0,ac.currentTime,.03)}else{audioInit();if(master)master.gain.setTargetAtTime(.13,ac.currentTime,.03)}};function render(d){targetEl.textContent=d.target;statusEl.textContent=d.status;const a=d.scores;const lead=Math.max(1,...a.map(x=>x.score));progress.style.width=Math.min(100,lead/d.target*100)+'%';let changed=0;a.forEach(x=>{const old=prev.get(x.name)||0;if(x.score>old)changed+=x.score-old});if(changed&&Date.now()-lastSound>90){if(changed>=10)boostSound();else voteSound();lastSound=Date.now()}grid.innerHTML='';a.forEach((x,i)=>{const el=document.createElement('div');el.className='cell '+(i<3?'top'+(i+1):'');if(x.score>(prev.get(x.name)||0))el.classList.add('flash');el.innerHTML='<div class="rank">'+(i<3?'RANK '+(i+1):'')+'</div><div class="flag" title="'+x.name+'">'+x.flag+'</div><div class="score">'+x.score+'</div>';grid.appendChild(el)});prev=new Map(a.map(x=>[x.name,x.score]))}function connect(){const w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);w.onmessage=e=>render(JSON.parse(e.data));w.onclose=()=>{statusEl.textContent='Disconnected — reconnecting…';setTimeout(connect,2000)}}connect();</script></body></html>
