<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08060d" />
  <title>🌍 Country Points — YouTube Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="screen">
    <section class="rules">
      <div class="rule"><span class="bubble">•••</span><div><b>COMMENT YOUR COUNTRY</b><strong>+1 <small>Points</small></strong></div></div>
      <div class="rule-divider"></div>
      <div class="rule"><span class="gem">◆</span><div><b>GIFTS, SUPER CHAT</b><strong class="gold">+1000 <small>Points</small></strong></div></div>
    </section>

    <section id="boostTicker" class="boost-ticker"><span>⚡</span><b>READY!</b><em>Type your country in chat to boost it.</em></section>

    <section class="thanks">
      <div class="thanks-title">💝 SPECIAL THANKS <small>(Gift Senders)</small></div>
      <div id="supporters" class="supporters"><span>Waiting for our first booster…</span></div>
    </section>

    <section class="country-wall">
      <div class="wall-head"><b>🌎 COUNTRY RANKINGS</b><span id="liveStatus">CONNECTING</span></div>
      <div id="countries" class="countries" aria-live="polite"></div>
    </section>

    <footer class="footer">
      <div><b id="totalPoints">0</b><span>TOTAL POINTS</span></div>
      <div><b id="totalVotes">0</b><span>COMMENTS</span></div>
      <div><b id="uniqueVoters">0</b><span>VOTERS</span></div>
      <div><b id="countryCount">195</b><span>COUNTRIES</span></div>
      <button id="voiceToggle" type="button">🔊 VOICE</button>
    </footer>
  </main>

  <div id="eventToast" class="event-toast" aria-live="assertive"></div>
  <div id="demoPanel" class="demo-panel hidden">
    <div class="demo-head"><strong>DEMO</strong><button id="closeDemo">×</button></div>
    <input id="demoSearch" placeholder="Search a country…" autocomplete="off" />
    <div id="demoCountries"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
