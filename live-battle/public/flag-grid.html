<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a2d">
<title>Where Are You From? — Flag Grid Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07082a;color:#fff;font-family:Inter,Arial,sans-serif}body{display:grid;place-items:center}.screen{position:relative;width:min(100vw,56.25vh);height:min(177.7777778vw,100vh);overflow:hidden;background:radial-gradient(circle at 50% 16%,#1b1761 0,#0b0b36 38%,#03051e 100%);isolation:isolate}.screen:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px);opacity:.5;pointer-events:none}.glow{position:absolute;border-radius:50%;filter:blur(28px);opacity:.55;z-index:-1}.g1{width:42%;height:15%;left:-8%;top:4%;background:#009eff}.g2{width:38%;height:14%;right:-5%;top:5%;background:#ffb000}.header{height:15%;display:flex;align-items:center;justify-content:center;gap:5%;padding:2% 5% 0}.earth,.party{font-size:clamp(30px,6vw,68px);filter:drop-shadow(0 0 15px currentColor)}.earth{color:#00d9ff}.party{color:#ffc400}.title{text-align:center;line-height:.84;font-family:"Baloo 2",sans-serif;font-weight:800;letter-spacing:-.03em;text-shadow:0 3px 0 #17143c,0 0 18px rgba(255,255,255,.12)}.title .a{display:block;font-size:clamp(27px,6vw,65px)}.title .b{display:block;color:#ffd629;font-size:clamp(31px,7vw,75px);margin-top:2%}.subscribe{height:7%;margin:0 8%;border:3px solid #ffe500;border-radius:13px;background:linear-gradient(#ff2929,#e00000);display:grid;place-items:center;font-family:"Baloo 2";font-size:clamp(16px,3.8vw,37px);font-weight:800;box-shadow:0 5px 0 #6c0712,0 0 24px rgba(255,30,30,.35);white-space:nowrap}.ticker{height:5.2%;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border-bottom:2px solid #19e4ff;border-top:2px solid #ff36d4;margin-top:1%;font-family:"Baloo 2";font-size:clamp(12px,2.5vw,25px);text-shadow:0 0 8px rgba(255,255,255,.25)}.ticker b{color:#4cff73}.top3{height:13.5%;display:grid;grid-template-columns:repeat(3,1fr);gap:3%;padding:2.5% 7% 1.5%;align-items:start}.champ{position:relative;text-align:center}.champ .rank{position:absolute;top:-10%;left:50%;transform:translateX(-50%);background:#ec2d76;border:2px solid #ff8db7;border-radius:12px;padding:1% 12%;font-size:clamp(9px,1.8vw,18px);font-weight:900;white-space:nowrap;z-index:2}.champ:first-child .rank{background:#e52275}.champ .flag{height:58%;min-height:35px;border:2px solid #30345d;background:#101334;display:grid;place-items:center;font-size:clamp(28px,6vw,62px);box-shadow:0 4px 0 #171a43}.champ:first-child .flag{border-color:#ffd500;box-shadow:0 0 20px rgba(255,214,0,.45)}.champ .score{font-family:"Baloo 2";font-size:clamp(18px,4.2vw,42px);font-weight:800;margin-top:3%;line-height:1}.champ .name{font-size:clamp(7px,1.5vw,15px);font-weight:800;margin-top:2%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grid{height:58.5%;padding:1% 1.8% 0;display:grid;grid-template-columns:repeat(10,1fr);grid-auto-rows:minmax(0,1fr);gap:2px 4px;overflow:hidden}.cell{min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;border-radius:3px;padding:1px}.cell .flag{width:100%;height:58%;display:grid;place-items:center;font-size:clamp(17px,3.3vw,36px);line-height:1;background:#10122f;border:1px solid #252952;box-shadow:0 1px 0 rgba(255,255,255,.05)}.cell .score{font-family:"Baloo 2";font-weight:800;font-size:clamp(9px,2vw,20px);line-height:1.05;margin-top:2px;text-shadow:0 2px 0 #070719}.cell.hot .flag{border-color:#2de8ff;box-shadow:0 0 12px rgba(0,219,255,.55)}.cell.up .flag{border-color:#ffd72a;box-shadow:0 0 14px rgba(255,215,42,.75);animation:pop .45s ease}.cell.up .score{color:#ff6977}.cell .num{position:absolute;left:2px;top:1px;font-size:clamp(6px,1.2vw,11px);opacity:.65}.footer{height:0;position:absolute;left:0;right:0;bottom:0}.prompt{position:absolute;bottom:1.5%;left:7%;right:7%;height:6.5%;border-radius:10px;background:#f20d16;border:2px solid #ffcc00;display:grid;place-items:center;font-family:"Baloo 2";font-size:clamp(12px,2.6vw,27px);font-weight:800;box-shadow:0 4px 0 #65070b}.stats{position:absolute;bottom:0;left:0;right:0;height:1.5%;display:flex;justify-content:center;gap:7%;font-size:clamp(6px,1.2vw,12px);opacity:.7}.newvote{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;background:linear-gradient(135deg,#ff2458,#ff8a00);border:3px solid #fff;border-radius:16px;padding:2% 6%;text-align:center;box-shadow:0 10px 50px rgba(255,34,88,.5);z-index:20;transition:.35s}.newvote.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.newvote small{display:block;font-weight:900}.newvote b{display:block;font-family:"Baloo 2";font-size:clamp(25px,6vw,60px)}@keyframes pop{50%{transform:scale(1.14)}100%{transform:scale(1)}}
@media(max-aspect-ratio:8/14){.grid{gap:1px 2px}.top3{padding-left:5%;padding-right:5%}.prompt{bottom:1%}}@media(min-aspect-ratio:10/16){.screen{transform:scale(.94)}}
</style>
</head>
<body>
<div class="screen">
  <div class="glow g1"></div><div class="glow g2"></div>
  <header class="header"><div class="earth">🌍</div><div class="title"><span class="a">WHERE ARE YOU</span><span class="b">FROM?</span></div><div class="party">🤩</div></header>
  <div class="subscribe">📢 Subscribe = Get +100 Points</div>
  <div class="ticker" id="ticker">🌎 LIVE FLAG BATTLE <b>&nbsp;—&nbsp; TYPE YOUR COUNTRY IN CHAT!</b></div>
  <section class="top3" id="top3"></section>
  <main class="grid" id="grid"></main>
  <div class="newvote" id="newvote"><small>+1 VOTE</small><b id="voteName">INDIA</b></div>
  <div class="prompt">💬 TYPE YOUR COUNTRY IN THE CHAT!</div>
  <div class="stats"><span id="total">0 VOTES</span><span id="countries">195 COUNTRIES</span><span id="status">CONNECTING</span></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script type="module">
import { COUNTRIES } from './countries.js';
const $=id=>document.getElementById(id); const socket=io({transports:['websocket','polling']});
let scores=Object.fromEntries(COUNTRIES.map(c=>[c.code,0])); let lastLeader=null; let initialized=false;
const demo=new URLSearchParams(location.search).get('demo')==='1';
function fmt(n){return new Intl.NumberFormat('en-US').format(n||0)}
function rows(){return COUNTRIES.map(c=>({...c,score:scores[c.code]||0})).sort((a,b)=>b.score-a.score||a.number-b.number)}
function render(state){if(Array.isArray(state.countries)){scores=Object.fromEntries(state.countries.map(c=>[c.code,Number(c.score)||0]))}else{for(const c of state.leaderboard||[])scores[c.code]=Number(c.score)||0}const r=rows(),top=r.slice(0,3);$('top3').innerHTML=top.map((c,i)=>`<article class="champ"><div class="rank">${i===0?'👑 ':''}RANK ${i+1}</div><div class="flag">${c.flag}</div><div class="score">${fmt(c.score)}</div><div class="name">${c.name}</div></article>`).join('');const rest=r.slice(3,153);$('grid').innerHTML=rest.map((c,i)=>`<div class="cell ${c.score>0?'hot':''}" data-code="${c.code}"><span class="num">${i+4}</span><div class="flag">${c.flag}</div><div class="score">${fmt(c.score)}</div></div>`).join('');$('total').textContent=`${fmt(state.totalVotes)} VOTES`;$('countries').textContent=`${state.countryCount||195} COUNTRIES`;$('status').textContent=state.youtube?.live?'● LIVE':state.youtube?.connected?'● READY':'● DEMO';if(initialized&&top[0]&&top[0].code!==lastLeader)announce(top[0]);if(top[0])lastLeader=top[0].code;initialized=true}
function announce(c){$('voteName').textContent=c.name.toUpperCase();const n=$('newvote');n.classList.remove('show');void n.offsetWidth;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),1800)}
function voteToast(v){if(!v?.country)return;const el=document.querySelector(`[data-code="${CSS.escape(v.country.code)}"]`);if(el){el.classList.remove('up');void el.offsetWidth;el.classList.add('up');setTimeout(()=>el.classList.remove('up'),600)}$('ticker').innerHTML=`@viewer <b>${v.country.name} +1</b> &nbsp; • &nbsp; 🌍 KEEP VOTING!`;fetch('/api/all-state').then(r=>r.json()).then(render).catch(()=>{})}
socket.on('connect',()=>{$('status').textContent='● CONNECTED'});socket.on('disconnect',()=>{$('status').textContent='● RECONNECTING'});socket.on('state',s=>{fetch('/api/all-state').then(r=>r.json()).then(render).catch(()=>render(s))});socket.on('vote',voteToast);fetch('/api/all-state').then(r=>r.json()).then(render).catch(()=>fetch('/api/state').then(r=>r.json()).then(render).catch(()=>{}));
if(demo){let timer=setInterval(()=>{const pool=COUNTRIES.filter(c=>['IN','US','BR','PH','ID','NP','MY','TR','VN','JP'].includes(c.code));const c=pool[Math.floor(Math.random()*pool.length)];fetch('/api/demo-vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({country:c.code})}).catch(()=>{});},1200);window.addEventListener('beforeunload',()=>clearInterval(timer))}
</script>
</body></html>
